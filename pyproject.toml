[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mattoccia-esae"
version = "0.1.0"
description = "Local, evidence-first C/C++ embedded software analysis prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
esae = "esae.cli:main"

[tool.setuptools.package-data]
esae = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: executes installed native analyzers", "ollama: requires explicitly configured local Ollama"]
